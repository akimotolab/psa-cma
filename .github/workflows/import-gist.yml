# One-time workflow: imports the history of the original gist(s) into this repository.
# Run it once from the Actions tab (workflow_dispatch). It is removed afterwards.
name: Import gist history
on: workflow_dispatch
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge the gist history
        env:
          GISTS: "f342a139a6dfcfd55dbc5e345dbf4f9f"
        run: |
          git config user.name "Youhei Akimoto"
          git config user.email "youhei.akimoto@bbo.cs.tsukuba.ac.jp"
          for id in $GISTS; do
            git fetch "https://gist.github.com/$id.git" "+HEAD:refs/gist/$id"
            git merge --allow-unrelated-histories --no-edit -m "Import the history of gist $id" "refs/gist/$id"
          done
          git push origin HEAD
